<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Cortagiro: simulador de som de motor no navegador, com 55 motores lendários.">
<meta name="theme-color" content="#ffffff">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Cortagiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Instrument+Sans:wght@400..600&family=Martian+Mono:wdth,wght@75..112.5,400..600&display=swap">
<style>
/* Layout: one scrolling column, ordered by importance.
   1 the driving deck (tach, throttle pedal, gyroscope, start) · 2 the car · 3 sound · 4 measurements · 5 every other setting. */
:root {
  --bg: #e3e4df;
  --panel: #f9f9f7;
  --panel2: #efefeb;
  --plate: #ffffff;
  --line: #d4d5cf;
  --line2: #b9bbb4;
  --ink: #18191b;
  --dim: #5c5f63;
  --faint: #8a8d90;
  --acc: #2747cc;
  --acc-soft: #dfe5fb;
  --amber: #b86e00;
  --red: #d2382a;
  --green: #17925a;
  --violet: #7346c8;
  --f-disp: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif;
  --f-mono: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gutR: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--plate); }
* { box-sizing: border-box; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
kbd { font-family: var(--f-mono); font-size: 9px; color: var(--dim); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; background: var(--plate); }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 10px; padding-block: 10px; padding-left: var(--gut); padding-right: var(--gutR); border-bottom: 1px solid var(--line2); background: var(--plate); }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand b { font-family: var(--f-disp); font-stretch: 125%; font-weight: 800; font-size: 20px; letter-spacing: 0.02em; line-height: 1; }
.brand span { color: var(--faint); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { border: 1px solid var(--line2); background: var(--plate); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.dark kbd, .btn.on kbd { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .45); }
.btn.on { background: var(--acc); border-color: var(--acc); color: #fff; }
.btn.power.running { background: var(--plate); color: var(--red); border-color: var(--red); }
.btn.power.running kbd { color: var(--red); border-color: var(--red); }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 999px; overflow: hidden; background: var(--plate); }
.seg button { background: transparent; border: 0; padding: 7px 12px; font-size: 12.5px; font-weight: 600; color: var(--dim); flex: 1 1 auto; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--ink); color: #fff; }
.seg.lang button { font-family: var(--f-mono); font-size: 10.5px; padding: 6px 9px; }

.page { display: grid; gap: 12px; padding-block: 12px 32px; padding-left: var(--gut); padding-right: var(--gutR); max-width: 1500px; margin: 0 auto;
  grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); grid-template-areas: "deck plate" "sound sound" "meas meas" "set set" "keys keys"; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }

/* ---------- 1 · driving deck ---------- */
.deck { grid-area: deck; background: var(--plate); display: grid; grid-template-columns: minmax(0, 1fr) 210px 76px; grid-template-rows: minmax(330px, 1fr) auto; grid-template-areas: "tach ctl pedal" "telem telem pedal"; overflow: hidden; touch-action: none; }
.tachwrap { grid-area: tach; position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 330px; }
.leds { display: flex; justify-content: center; gap: 5px; padding-top: 14px; }
.leds i { width: 13px; height: 7px; border-radius: 2px; background: var(--line); }
.leds i.g { background: var(--green); } .leds i.a { background: var(--amber); } .leds i.r { background: var(--red); } .leds i.b { background: var(--acc); }
.cv { flex: 1; min-height: 0; position: relative; }
.cv canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.starter { position: absolute; left: 50%; top: 54%; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 10px; text-align: center; }
.starter button { width: 108px; height: 108px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; font-family: var(--f-disp); font-stretch: 112%; font-weight: 800; font-size: 14px; letter-spacing: 0.08em; line-height: 1.15; box-shadow: 0 0 0 6px var(--plate), 0 0 0 7px var(--line2); }
.starter button:hover { background: var(--acc); }
.starter small { color: var(--dim); font-size: 12px; max-width: 230px; background: var(--plate); padding: 4px 8px; border-radius: 4px; }
.status { position: absolute; left: 12px; right: 12px; bottom: 8px; font-size: 11.5px; color: var(--faint); display: flex; align-items: center; gap: 6px; pointer-events: none; }
.status.toast { color: var(--ink); font-weight: 500; background: var(--acc-soft); padding: 6px 9px; border-radius: 6px; }

.ctl { grid-area: ctl; border-left: 1px solid var(--line); padding: 14px; display: grid; gap: 8px; align-content: start; }
.ctl .btn { width: 100%; padding: 10px 14px; font-size: 14px; }
.ctl .gyro { padding: 14px; font-size: 15px; border-width: 2px; border-color: var(--acc); color: var(--acc); }
.ctl .gyro.on { color: #fff; }
.ctl .gyro svg { flex: none; }
.ctl .seg { display: flex; width: 100%; }
.ctl .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ctl .row2 .btn { padding: 8px 6px; font-size: 12.5px; }
.ctl small.lbl { font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); font-weight: 600; margin-top: 4px; }

.pedal { grid-area: pedal; border-left: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 0; cursor: ns-resize; user-select: none; background: var(--panel); }
.pedal label { font-size: 9.5px; letter-spacing: 0.14em; color: var(--dim); font-weight: 700; writing-mode: vertical-rl; transform: rotate(180deg); }
.pedal .track { flex: 1; width: 40px; border-radius: 12px; background: repeating-linear-gradient(to top, transparent 0 9px, var(--line) 9px 10px), var(--panel2); border: 1px solid var(--line2); position: relative; overflow: hidden; }
.pedal .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--ink); }
.pedal output { font-family: var(--f-mono); font-size: 11px; font-weight: 600; }

.telem { grid-area: telem; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) minmax(0, 1.6fr); }
.tile { padding: 8px 12px; border-right: 1px solid var(--line); display: grid; gap: 1px; min-width: 0; }
.tile label { font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-family: var(--f-disp); font-stretch: 75%; font-weight: 700; font-size: 25px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile .v small { font-family: var(--f-body); font-stretch: 100%; font-size: 11px; color: var(--dim); font-weight: 500; margin-left: 3px; }
.bar { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; width: 0; background: var(--amber); }
.lamps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 8px 10px; align-content: center; }
.lamp { font-family: var(--f-disp); font-weight: 700; font-size: 10px; letter-spacing: 0.06em; text-align: center; padding: 3px 0; border-radius: 3px; border: 1px solid var(--line); color: var(--faint); }
.lamp.on { color: #fff; border-color: transparent; }
.lamp.on[data-c=vtec] { background: var(--amber); }
.lamp.on[data-c=cut], .lamp.on[data-c=pop] { background: var(--red); }
.lamp.on[data-c=bov], .lamp.on[data-c=gyro] { background: var(--acc); }
.lamp.on[data-c=als], .lamp.on[data-c=lc] { background: var(--violet); }

/* ---------- 2 · the car ---------- */
.plate { grid-area: plate; background: var(--plate); overflow: hidden; display: flex; flex-direction: column; }
.photo { position: relative; aspect-ratio: 16 / 9; background: var(--panel2); overflow: hidden; max-width: 100%; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .credit { position: absolute; right: 6px; bottom: 6px; max-width: calc(100% - 12px); font-size: 9.5px; color: #fff; background: rgba(24, 25, 27, .62); padding: 2px 6px; border-radius: 3px; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.photo .credit:hover { text-decoration: underline; }
.noimg { width: 100%; height: 100%; display: grid; place-items: center; font-family: var(--f-disp); font-stretch: 125%; font-weight: 800; font-size: 26px; color: var(--line2); }
.plate-body { padding: 14px 16px 16px; display: grid; gap: 10px; }
.eyebrow { display: flex; align-items: center; gap: 7px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.plate h1 { margin: 4px 0 0; font-family: var(--f-disp); font-stretch: 125%; font-weight: 800; font-size: clamp(22px, 2.3vw, 32px); line-height: 1; letter-spacing: -0.01em; text-transform: uppercase; text-wrap: balance; }
.plate .code { font-family: var(--f-mono); font-size: 11px; color: var(--dim); margin-top: 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chips span { font-family: var(--f-mono); font-size: 10px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; background: var(--panel); }
.plate-stats { display: flex; gap: 22px; }
.stat { display: grid; gap: 1px; }
.stat label { font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.stat b { font-family: var(--f-disp); font-stretch: 75%; font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat b small { font-family: var(--f-body); font-stretch: 100%; font-size: 12px; color: var(--dim); font-weight: 500; margin-left: 3px; }
.stat span { font-family: var(--f-mono); font-size: 10px; color: var(--dim); }
.stat.pw b { color: var(--amber); } .stat.tq b { color: var(--acc); }
.plate-nav { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.plate-nav .arrow { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line2); background: var(--plate); font-size: 17px; line-height: 1; display: grid; place-items: center; flex: none; }
.plate-nav .arrow:hover { border-color: var(--ink); }
.plate-nav .grow { flex: 1 1 auto; }
.btn[hidden] { display: none; }
.story { margin: 0; font-size: 13px; line-height: 1.55; color: var(--dim); background: var(--panel); border-radius: 8px; padding: 10px 12px; }
.story[hidden] { display: none; }
.story button { border: 0; background: none; padding: 0; color: var(--acc); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; margin-left: 4px; }
.flag { width: 22px; height: 15px; flex: none; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .14); display: block; }

/* ---------- 3 · sound ---------- */
.sbar { grid-area: sound; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr) 200px; gap: 12px 20px; align-items: start; padding: 14px 16px; }
.sgrp { display: grid; gap: 7px; min-width: 0; }
.sgrp > label, .sgrp > .lbl { font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.sgrp .seg { display: flex; flex-wrap: wrap; border-radius: 8px; }
.sgrp .seg button { padding: 8px 10px; }
.sgrp output { font-family: var(--f-mono); font-size: 10px; color: var(--dim); }

/* ---------- 4 · measurements ---------- */
.meas { grid-area: meas; display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.panel { display: flex; flex-direction: column; overflow: hidden; height: 250px; }
.ph { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-family: var(--f-disp); font-stretch: 112%; font-weight: 700; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.ph .meta { margin-left: auto; font-family: var(--f-mono); font-weight: 400; font-size: 10px; letter-spacing: 0; text-transform: none; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph select { background: var(--plate); border: 1px solid var(--line2); border-radius: 4px; font-family: var(--f-mono); font-size: 10px; padding: 2px 4px; letter-spacing: 0; text-transform: none; }

/* ---------- 5 · all other settings ---------- */
.settings { grid-area: set; padding: 4px 0 8px; }
.settings > h2 { margin: 0; padding: 12px 16px 6px; font-family: var(--f-disp); font-stretch: 125%; font-weight: 800; font-size: 18px; text-transform: uppercase; }
.rail { columns: 3 300px; column-gap: 0; }
.rail details { break-inside: avoid; border-top: 1px solid var(--line); }
.rail summary { list-style: none; cursor: pointer; padding: 13px 16px; display: flex; align-items: center; gap: 10px; font-family: var(--f-disp); font-stretch: 112%; font-weight: 700; font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase; }
.rail summary::-webkit-details-marker { display: none; }
.rail summary::after { content: '+'; margin-left: auto; color: var(--faint); font-family: var(--f-mono); }
.rail details[open] summary::after { content: '–'; }
.ctl2 { padding: 6px 16px 11px; display: grid; gap: 6px; }
.ctl2[hidden] { display: none !important; }
.ctl-h { display: flex; align-items: center; gap: 8px; }
.ctl-h label { font-size: 13px; font-weight: 500; }
.ctl-h output { margin-left: auto; font-family: var(--f-mono); font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ctl2 .seg { display: flex; flex-wrap: wrap; border-radius: 6px; }
.ctl2 .seg button { padding: 6px 6px; }
.ctl2 select { width: 100%; background: var(--plate); border: 1px solid var(--line2); border-radius: 6px; padding: 6px 8px; }
.switch { font-size: 13px; font-weight: 500; cursor: pointer; }
input.sw { appearance: none; -webkit-appearance: none; width: 34px; height: 19px; border-radius: 10px; background: var(--line2); position: relative; cursor: pointer; flex: none; margin: 0 0 0 auto; }
input.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: left .15s; }
input.sw:checked { background: var(--acc); }
input.sw:checked::after { left: 17px; }
.q { flex: none; width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--line2); background: var(--plate); color: var(--dim); font: 600 9.5px/1 var(--f-mono); padding: 0; display: inline-grid; place-items: center; }
.q:hover, .q.on { border-color: var(--acc); color: #fff; background: var(--acc); }
.desc { margin: 0; color: var(--dim); font-size: 12px; line-height: 1.45; }
.info { margin: 0; padding: 9px 11px; border-radius: 6px; background: var(--acc-soft); font-size: 12.5px; line-height: 1.5; }
.note { margin: 0; padding: 4px 16px 14px; color: var(--faint); font-size: 12px; line-height: 1.45; }
.note[hidden] { display: none; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--ink) var(--pct, 50%), var(--line2) var(--pct, 50%)); }
input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--line2); }
input[type=range]::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--ink); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6.5px; border-radius: 50%; background: var(--plate); border: 2px solid var(--ink); }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--plate); border: 2px solid var(--ink); }

.keys { grid-area: keys; display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--dim); font-size: 12px; padding: 0 4px; }
.keys span { white-space: nowrap; }
.keys kbd { margin-right: 4px; }
.err { color: var(--red); font-size: 12px; }

/* ---------- garage overlay ---------- */
.gov { position: fixed; inset: 0; z-index: 20; background: rgba(24, 25, 27, .42); display: grid; place-items: center; padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); padding-left: var(--gut); padding-right: var(--gutR); }
.gov[hidden] { display: none; }
.gbox { width: min(1200px, 100%); height: min(860px, 100%); background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; overflow: hidden; }
.ghead { display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px; flex-wrap: wrap; }
.ghead h2 { margin: 0; font-family: var(--f-disp); font-stretch: 125%; font-weight: 800; font-size: 24px; text-transform: uppercase; line-height: 1; }
.ghead .x { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line2); background: var(--plate); font-size: 18px; flex: none; }
.gtools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 16px 12px; border-bottom: 1px solid var(--line); }
.gtools[hidden] { display: none; }
.gtools input { flex: 1 1 220px; min-width: 0; background: var(--plate); border: 1px solid var(--line2); border-radius: 999px; padding: 8px 14px; }
.gtools p { margin: 0; color: var(--dim); font-size: 13px; }
.cats { display: flex; flex-wrap: wrap; gap: 4px; }
.cats button { border: 1px solid var(--line2); background: var(--plate); border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; color: var(--dim); display: inline-flex; align-items: center; gap: 6px; }
.cats button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.cats button small { font-family: var(--f-mono); font-weight: 400; font-size: 10px; opacity: .7; }
.ggrid { overflow-y: auto; padding: 14px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); grid-auto-rows: max-content; gap: 12px; align-content: start; }
.ggrid[hidden] { display: none; }
.gcard { text-align: left; background: var(--plate); border: 1px solid var(--line); border-radius: 10px; padding: 0 0 12px; display: grid; gap: 3px; position: relative; overflow: hidden; }
.gcard:hover { border-color: var(--ink); }
.gcard.on { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
.ph16 { display: block; aspect-ratio: 16 / 9; background: var(--panel2); overflow: hidden; max-width: 100%; }
.ph16 img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gcard .ph16 { margin-bottom: 7px; }
.gcard .top2, .gcard b, .gcard .cc, .gcard .cs { margin-inline: 12px; }
.gcard .top2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.gcard .ct { font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.gcard b { font-family: var(--f-disp); font-stretch: 112%; font-weight: 700; font-size: 15px; line-height: 1.15; }
.gcard.on b { color: var(--acc); }
.gcard .cc { font-family: var(--f-mono); font-size: 9.5px; color: var(--dim); }
.gcard .cs { display: flex; flex-wrap: wrap; gap: 2px 10px; white-space: nowrap; margin-top: 3px; font-family: var(--f-mono); font-size: 10px; }
.gcard .cs em { font-style: normal; color: var(--amber); font-weight: 600; }
.gcard .del { position: absolute; top: 8px; right: 8px; border: 1px solid var(--line2); background: var(--plate); border-radius: 999px; font-size: 11px; padding: 1px 8px; color: var(--dim); }
.gcard.mine { border-style: dashed; }
.gempty { color: var(--faint); grid-column: 1 / -1; padding: 20px 0; }
.gsave { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
.gsave[hidden] { display: none; }
.gsave input { flex: 1 1 200px; min-width: 0; background: var(--plate); border: 1px solid var(--line2); border-radius: 999px; padding: 7px 14px; }
.gfoot { font-size: 11px; color: var(--faint); flex-basis: 100%; }
.hist { overflow-y: auto; padding: 4px 16px 24px; }
.hist[hidden] { display: none; }
.hitem { display: grid; grid-template-columns: 64px 180px minmax(0, 1fr) auto; gap: 6px 18px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.hitem .yr { font-family: var(--f-disp); font-stretch: 75%; font-weight: 700; font-size: 28px; line-height: 1; color: var(--acc); font-variant-numeric: tabular-nums; }
.hitem .ph16 { width: 180px; border-radius: 6px; }
.hitem h3 { margin: 0 0 3px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: var(--f-disp); font-stretch: 112%; font-weight: 700; font-size: 16px; }
.hitem h3 small { font-family: var(--f-mono); font-weight: 400; font-size: 10px; color: var(--dim); }
.hitem p { margin: 0; color: var(--dim); font-size: 13px; line-height: 1.5; max-width: 80ch; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .page { grid-template-columns: minmax(0, 1fr); grid-template-areas: "deck" "plate" "sound" "meas" "set" "keys"; }
  .plate { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); }
  .photo { aspect-ratio: auto; min-height: 100%; }
  .meas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sbar { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .sbar .wet { grid-column: 1 / -1; max-width: 360px; }
}
@media (max-width: 760px) {
  .brand span, .keys, .starter small, .status:not(.toast) { display: none; }
  .deck { grid-template-columns: minmax(0, 1fr) 72px; grid-template-rows: minmax(300px, 62vw) auto auto; grid-template-areas: "tach pedal" "ctl ctl" "telem telem"; }
  .tachwrap { min-height: 300px; }
  .pedal .track { width: 36px; }
  .ctl { border-left: 0; border-top: 1px solid var(--line); grid-template-columns: 1fr 1fr; }
  .ctl .seg, .ctl small.lbl, .ctl .row2 { grid-column: 1 / -1; }
  .telem { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .telem .tile:nth-child(3n) { border-right: 0; }
  .telem .tile { border-bottom: 1px solid var(--line); }
  .telem .lamps { grid-column: 1 / -1; grid-template-columns: repeat(6, 1fr); }
  .plate { display: flex; }
  .photo { aspect-ratio: 16 / 9; min-height: 0; }
  .sbar { grid-template-columns: minmax(0, 1fr); }
  .sbar .wet { max-width: none; }
  .meas { grid-template-columns: minmax(0, 1fr); }
  .hitem { grid-template-columns: 56px minmax(0, 1fr); }
  .hitem .ph16 { display: none; }
  .hitem p, .hitem .btn { grid-column: 1 / -1; }
  .gbox { height: 100%; }
  .seg.lang button { padding: 6px 7px; }
}
@media (prefers-reduced-motion: reduce) { input.sw::after { transition: none; } }
</style>

<header class="top">
  <div class="brand">
    <svg width="28" height="20" viewBox="0 0 30 22" fill="none" aria-hidden="true"><path d="M4 19a11 11 0 1 1 22 0" stroke="#b9bbb4" stroke-width="3"/><path d="M4 19a11 11 0 0 1 17.8-8.6" stroke="#2747cc" stroke-width="3"/><path d="M15 19l7-9" stroke="#18191b" stroke-width="2" stroke-linecap="round"/></svg>
    <b>CORTAGIRO</b><span data-i="brandSub"></span>
  </div>
  <div class="seg lang" id="segLang" role="group"><button type="button" data-v="pt">PT</button><button type="button" data-v="es">ES</button><button type="button" data-v="en">EN</button></div>
</header>

<main class="page">
  <section class="card deck" id="stage">
    <div class="tachwrap">
      <div class="leds" id="leds"></div>
      <div class="cv"><canvas id="tach"></canvas></div>
      <div class="starter" id="starter">
        <button type="button" id="btnStart">ENGINE<br>START</button>
        <small data-i="starterHint"></small>
      </div>
      <div class="status" id="status"></div>
    </div>
    <div class="ctl">
      <button class="btn dark power" id="btnPower" type="button"><span id="powerTxt"></span> <kbd>I</kbd></button>
      <button class="btn gyro" id="btnGyro" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M3 8c-1.3 2.5-1.3 5.5 0 8M21 8c1.3 2.5 1.3 5.5 0 8"/></svg><span data-i="gyro"></span></button>
      <small class="lbl" data-i="gearbox"></small>
      <div class="seg" id="segDrive" role="group"><button type="button" data-v="n" data-i="neutral"></button><button type="button" data-v="d" data-i="drive"></button></div>
      <small class="lbl" data-i="pedalLbl"></small>
      <div class="seg" id="segThr" role="group"><button type="button" data-v="hold" data-i="pedalHold"></button><button type="button" data-v="spring" class="on" data-i="pedalSpring"></button></div>
      <div class="row2">
        <button class="btn" id="btnFly" type="button"><span data-i="flyby"></span> <kbd>F</kbd></button>
        <button class="btn" id="btnRand" type="button"><span data-i="random"></span> <kbd>R</kbd></button>
      </div>
    </div>
    <div class="pedal" id="pedal" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <output id="pedalOut">0%</output>
      <div class="track"><div class="fill" id="pedalFill"></div></div>
      <label data-i="pedal"></label>
    </div>
    <div class="telem">
      <div class="tile"><label data-i="powNow"></label><div class="v" id="tPow">0<small id="tPowU"></small></div></div>
      <div class="tile"><label data-i="tqNow"></label><div class="v" id="tTq">0<small>N·m</small></div></div>
      <div class="tile"><label data-i="boost"></label><div class="v" id="tBoost">0<small>bar</small></div><div class="bar"><i id="tBoostBar"></i></div></div>
      <div class="tile"><label data-i="fireFreq"></label><div class="v" id="tFire">0<small>Hz</small></div></div>
      <div class="tile"><label data-i="speed"></label><div class="v" id="tSpd">0<small>km/h</small></div></div>
      <div class="lamps">
        <div class="lamp" data-c="vtec" id="lVtec">VTEC</div>
        <div class="lamp" data-c="cut" id="lCut" data-i="lampCut"></div>
        <div class="lamp" data-c="pop" id="lPop">POP</div>
        <div class="lamp" data-c="bov" id="lBov">BOV</div>
        <div class="lamp" data-c="als" id="lAls">ALS</div>
        <div class="lamp" data-c="lc" id="lLc" data-i="lampLaunch"></div>
      </div>
    </div>
  </section>

  <section class="card plate" id="plate">
    <div class="photo" id="plPhoto"></div>
    <div class="plate-body">
      <div>
        <div class="eyebrow" id="plEyebrow"></div>
        <h1 id="plName"></h1>
        <div class="code" id="plCode"></div>
      </div>
      <div class="chips" id="plChips"></div>
      <div class="plate-stats">
        <div class="stat pw"><label data-i="peakPow"></label><b id="plPow"></b><span id="plPowR"></span></div>
        <div class="stat tq"><label data-i="peakTq"></label><b id="plTq"></b><span id="plTqR"></span></div>
      </div>
      <div class="plate-nav">
        <button class="arrow" type="button" id="btnPrev">‹</button>
        <button class="btn dark grow" type="button" id="btnGarage"><span id="garageTxt"></span> <kbd>G</kbd></button>
        <button class="arrow" type="button" id="btnNext">›</button>
        <button class="btn" type="button" id="btnStory" aria-expanded="false" aria-controls="plStory"><span data-i="story"></span></button>
      </div>
      <p class="story" id="plStory" hidden></p>
    </div>
  </section>

  <section class="card sbar" id="sbar">
    <div class="sgrp"><span class="lbl" id="sbMicL"></span><div class="seg" id="sbMic" role="group"></div><p class="desc" id="sbMicD"></p></div>
    <div class="sgrp"><span class="lbl" id="sbEnvL"></span><div class="seg" id="sbEnv" role="group"></div><p class="desc" id="sbEnvD"></p></div>
    <div class="sgrp wet"><label id="sbWetL" for="sbWet"></label><input type="range" id="sbWet" min="0" max="1" step="0.01"><output id="sbWetO"></output></div>
  </section>

  <section class="meas">
    <div class="card panel"><div class="ph"><span data-i="pEngine"></span> <span class="meta" id="engMeta"></span>
      <select id="slowSel"><option value="0.01">1/100×</option><option value="0.025" selected>1/40×</option><option value="0.1">1/10×</option><option value="1">1×</option></select></div>
      <div class="cv"><canvas id="eng"></canvas></div></div>
    <div class="card panel"><div class="ph"><span data-i="pDyno"></span> <span class="meta" id="dynoMeta"></span></div><div class="cv"><canvas id="dyno"></canvas></div></div>
    <div class="card panel"><div class="ph"><span data-i="pScope"></span> <span class="meta" data-i="pScopeMeta"></span></div><div class="cv"><canvas id="scope"></canvas></div></div>
    <div class="card panel"><div class="ph"><span data-i="pSpec"></span> <span class="meta" id="specMeta"></span></div><div class="cv"><canvas id="spec"></canvas></div></div>
  </section>

  <section class="card settings">
    <h2 data-i="settingsTitle"></h2>
    <div class="rail" id="rail"></div>
  </section>

  <div class="keys" id="keys"></div>
</main>

<div class="gov" id="gov" hidden>
  <div class="gbox" role="dialog" aria-modal="true" aria-labelledby="gTitle">
    <div class="ghead">
      <h2 id="gTitle" data-i="garageTitle"></h2>
      <div class="seg" id="gTabs" role="tablist"><button type="button" data-v="engines" data-i="tabEngines" class="on"></button><button type="button" data-v="history" data-i="tabHistory"></button></div>
      <button class="x" type="button" id="gClose">×</button>
    </div>
    <div class="gtools" id="gTools"><input id="gSearch" type="search" autocomplete="off"><div class="cats" id="gCats"></div></div>
    <div class="gtools" id="hTools" hidden><p data-i="histSub"></p></div>
    <div class="ggrid" id="gGrid"></div>
    <div class="hist" id="hList" hidden></div>
    <form class="gsave" id="gSave"><input id="saveName" maxlength="40"><button class="btn" type="submit" data-i="save"></button><span class="gfoot" data-i="photoNote"></span></form>
  </div>
</div>
<script src="engine-core.js"></script>
<script src="presets.js"></script>
<script src="i18n.js"></script>
<script src="history.js"></script>
<script src="photos.js"></script>
<script src="app.js"></script>
</body>
</html>
